name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v4
    
    # Установка зависимостей
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake doxygen graphviz libgtest-dev

    - name: Set up MSVC (Windows only)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v1.1

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install doxygen.install -y
        choco install graphviz -y

    # Конфигурация и сборка
    - name: Configure CMake
      run: cmake -B build -DBUILD_TESTS=ON -DBUILD_DOCS=ON -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          cmake --build build --config Release -- /m:2
        else
          cmake --build build --config Release --parallel 2
        fi

    # Тестирование
    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    # Артефакты и документация
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: card-heroes-battle-${{ matrix.os }}
        path: |
          build/bin/*
          build/docs/html/

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/docs/html
