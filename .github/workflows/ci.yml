name: CI workflows

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
        
    steps:
    - uses: actions/checkout@v4
    
    # Установка зависимостей (только для Ubuntu)
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake doxygen graphviz libgtest-dev

    # Конфигурация и сборка
    - name: Configure CMake
      run: cmake -B build -DBUILD_TESTS=ON -DBUILD_DOCS=ON -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel 2

    # Тестирование
    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    # Артефакты и документация
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: card-heroes-battle-ubuntu
        path: |
          build/bin/*
          build/docs/html/

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/docs/html
